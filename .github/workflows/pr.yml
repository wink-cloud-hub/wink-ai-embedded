name: Pull Request Fast CI

on:
  pull_request:
    branches: [ master, main, develop ]
  push:
    branches: [ master, main, develop ]

jobs:
  host-build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Toolchain Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Toolchain Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja cmake --no-progress

      - name: Install Toolchain Python Dependencies
        shell: bash
        run: |
          # NOTE: winkcli ships via GitHub Releases (+ thin PyPI launcher, pending publication).
          # Do NOT `pip install winkcli` until the official package is live — name-squatting risk.
          pip install pytest pyyaml jinja2 rich

      - name: Detect wink toolchain
        id: toolchain
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1 \
             || [ -f ../wink-tools/tools/codegen/scripts/list_drivers.py ] \
             || [ -f ../packages/wink-tools/tools/codegen/scripts/list_drivers.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::wink toolchain is not distributed yet; firmware build/test steps are skipped (roadmap: cross-platform winkcli distribution)."
          fi

      - name: Run Architecture & Safety Linter (Unified Guards)
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1; then
            winkcli lint --pack isr_safety --pack wasm_parity --pack layering --pack api --pack dal --baseline .github/lint-baseline.json
          elif [ -f wink-micro-os/tools/run_lint.py ]; then
            python wink-micro-os/tools/run_lint.py --pack isr_safety --pack wasm_parity --pack layering --pack api --pack dal --baseline .github/lint-baseline.json
          else
            echo "::warning::Arch lint runner unavailable in public CI (wink-tools engine not public). Gate runs in the local/release pipeline."
          fi

      - name: Configure CMake (Host)
        if: steps.toolchain.outputs.available == 'true'
        run: |
          cmake -B build_host -S wink-micro-os -G Ninja \
            -DTARGET_PLATFORM=host \
            -DWINK_APP_DIR=wink-micro-app/unisim_smoke

      - name: Build Host Binaries
        if: steps.toolchain.outputs.available == 'true'
        run: cmake --build build_host

      - name: Run PAL & DAL Unit Tests
        if: steps.toolchain.outputs.available == 'true'
        run: ctest --test-dir build_host --output-on-failure

  wasm-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Toolchain Python Dependencies
        shell: bash
        run: |
          # NOTE: winkcli ships via GitHub Releases (+ thin PyPI launcher, pending publication).
          # Do NOT `pip install winkcli` until the official package is live — name-squatting risk.
          pip install pytest pyyaml jinja2 rich

      - name: Detect wink toolchain
        id: toolchain
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1 \
             || [ -f ../wink-tools/tools/codegen/scripts/list_drivers.py ] \
             || [ -f ../packages/wink-tools/tools/codegen/scripts/list_drivers.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::wink toolchain is not distributed yet; wasm build/test steps are skipped (roadmap: cross-platform winkcli distribution)."
          fi

      - name: Configure CMake (Host tree hosts the emcc wasm tests)
        if: steps.toolchain.outputs.available == 'true'
        run: |
          cmake -B build_host -S wink-micro-os -G Ninja \
            -DTARGET_PLATFORM=host \
            -DWINK_APP_DIR=wink-micro-app/unisim_smoke

      - name: Build (emcc wasm test targets are ALL)
        if: steps.toolchain.outputs.available == 'true'
        run: cmake --build build_host

      - name: Run wasm/Node tests (label "wasm")
        if: steps.toolchain.outputs.available == 'true'
        run: ctest --test-dir build_host -L wasm --output-on-failure

  peripherals-sdk-sandbox:
    # SDK-only dependency tree (plan 2026-09-17 §0.5 invariant #2): the peripheral
    # suite must typecheck and its migrated unit tests must pass with just the
    # published @wink-ai/unisim-sdk + @wink-ai/unisim-ui — never the closed engine.
    # The full 12-plugin build half of the sandbox gate runs in the wink-ai CI
    # (`peripherals-sandbox` job), where the winkcli toolchain source is available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Stage sandbox copy
        run: |
          SANDBOX="${{ runner.temp }}/wink-sandbox/wink-ai-embedded/wink-plugin-peripherals"
          mkdir -p "$(dirname "$SANDBOX")"
          cp -r wink-plugin-peripherals "$SANDBOX"
          # Keep the committed dist bundles: the load smoke needs them; typecheck
          # reads sources only and never touches dist.
          rm -rf "$SANDBOX/node_modules"
          echo "SANDBOX=$SANDBOX" >> "$GITHUB_ENV"

      - name: Install registry deps (SDK + UI only)
        run: bun install
        working-directory: ${{ env.SANDBOX }}

      - name: Assert the closed engine is absent
        run: |
          if [ -e node_modules/@wink-ai/unisim ]; then
            echo "::error::@wink-ai/unisim leaked into the peripheral dependency tree"
            exit 1
          fi
          ls node_modules/@wink-ai
        working-directory: ${{ env.SANDBOX }}

      - name: Sandbox typecheck (tsc --noEmit, no engine)
        run: bun run typecheck
        working-directory: ${{ env.SANDBOX }}

      - name: Bundle load smoke (12 builtins, SDK identity)
        run: bun run test:bundles
        working-directory: ${{ env.SANDBOX }}

      - name: Migrated stub-host unit tests
        run: |
          bun test \
            builtin/mono_oled/1.0.0/src/__tests__/simulation.test.ts \
            builtin/rc_servo/1.0.0/src/__tests__/simulation.test.ts
        working-directory: ${{ env.SANDBOX }}

  docs-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "PyYAML>=6"

      - name: wink-tools docs i18n pairing
        run: python docs/scripts/check_wink_tools_i18n.py

      - name: winkcli docs gate (command parity + appendix + redlines)
        run: python .github/scripts/check_winkcli_docs.py
