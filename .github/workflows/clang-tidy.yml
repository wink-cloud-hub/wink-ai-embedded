name: Clang-Tidy Code Quality
on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Toolchain Python Dependencies
        shell: bash
        run: |
          # NOTE: winkcli ships via GitHub Releases (+ thin PyPI launcher, pending publication).
          # Do NOT `pip install winkcli` until the official package is live — name-squatting risk.
          pip install pytest pyyaml jinja2 rich

      - name: Detect wink toolchain
        id: toolchain
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1 \
             || [ -f ../wink-tools/tools/codegen/scripts/list_drivers.py ] \
             || [ -f ../packages/wink-tools/tools/codegen/scripts/list_drivers.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::wink toolchain is not distributed yet; clang-tidy / lint steps are skipped (roadmap: cross-platform winkcli distribution)."
          fi

      - name: Install Clang-Tidy & Build Tools
        if: steps.toolchain.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-17 cmake ninja-build

      - name: Configure CMake (compile database)
        if: steps.toolchain.outputs.available == 'true'
        run: |
          cmake -B build_host -S wink-micro-os -G Ninja \
            -DTARGET_PLATFORM=host \
            -DWINK_APP_DIR=wink-micro-app/fixtures/unisim_smoke \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Clang-Tidy
        if: steps.toolchain.outputs.available == 'true'
        shell: bash
        run: |
          if [ ! -f build_host/compile_commands.json ]; then
            echo "::warning::compile database unavailable; skipping clang-tidy."
            exit 0
          fi
          find wink-micro-os -name "*.c" -not -path "*/third_party/*" -print0 \
            | xargs -0 -r clang-tidy-17 -p build_host 2>&1 | tee clang-tidy-report.txt
          if grep -q "error:" clang-tidy-report.txt; then
            echo "::error::Clang-Tidy found errors, see report above"
            exit 1
          fi

      - name: Run wink lint (layering + API rules)
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1; then
            winkcli lint --root wink-micro-os --strict
          elif [ -f wink-micro-os/tools/run_lint.py ]; then
            python wink-micro-os/tools/run_lint.py --strict
          else
            echo "::warning::Arch lint runner unavailable in public CI (wink-tools engine not public). Gate runs in the local/release pipeline."
          fi
