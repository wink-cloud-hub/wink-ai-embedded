name: Clang-Tidy Code Quality
on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-17
          sudo ln -sf /usr/bin/clang-tidy-17 /usr/bin/clang-tidy

      - name: Run Clang-Tidy
        working-directory: wink-micro-os
        run: |
          # Check all C files, exclude third-party
          find . -name "*.c" -not -path "./third-party/*" | xargs clang-tidy 2>&1 | tee clang-tidy-report.txt
          
          # Fail if any errors
          if grep -q "error:" clang-tidy-report.txt; then
            echo "::error::Clang-Tidy found errors, see report above"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Toolchain Python Dependencies
        shell: bash
        run: |
          # NOTE: winkcli ships via GitHub Releases (+ thin PyPI launcher, pending publication).
          # Do NOT `pip install winkcli` until the official package is live — name-squatting risk.
          pip install pytest pyyaml jinja2 rich

      - name: Run wink lint (layering + API rules)
        working-directory: wink-micro-os
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1; then
            winkcli lint --root . --strict
          elif [ -f tools/run_lint.py ]; then
            python tools/run_lint.py --strict
          else
            echo "::warning::Arch lint runner unavailable in public CI (wink-tools engine not public). Gate runs in the local/release pipeline."
          fi

