name: Nightly Stress & HW Sign-Off

on:
  schedule:
    - cron: '0 2 * * *' # Run at 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # T-012: dual-version IDF upstream traceability.
  #   v6.1 (pinned baseline): byte-exact diff of the vendor suite sources (blocking).
  #   v5.1 (legacy probe): presence + drift report only (non-blocking, risk R-008 accepted).
  idf-dual-version:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - idf: release-v6.1
            mode: block
          - idf: release-v5.1
            mode: probe
    continue-on-error: ${{ matrix.mode == 'probe' }}
    container: espressif/idf:${{ matrix.idf }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendor app upstream against ${{ matrix.idf }}
        run: |
          if [ "${{ matrix.mode }}" = "block" ]; then
            python3 wink-micro-os/frameworks/esp_idf/tools/check_vendor_app_upstream.py \
              --idf-tree /opt/esp/idf
          else
            python3 wink-micro-os/frameworks/esp_idf/tools/check_vendor_app_upstream.py \
              --idf-tree /opt/esp/idf --allow-hash-drift --allow-missing
          fi

  stress-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect wink toolchain
        id: toolchain
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1 \
             || [ -f ../wink-tools/tools/codegen/scripts/list_drivers.py ] \
             || [ -f ../packages/wink-tools/tools/codegen/scripts/list_drivers.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::wink toolchain is not distributed yet; stress simulation is skipped (roadmap: cross-platform winkcli distribution)."
          fi

      - name: Build & Run 30-min Stress Simulation
        if: steps.toolchain.outputs.available == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          cmake -B build/tests/host/stress -S wink-micro-os -DTARGET_PLATFORM=host -DWINK_APP_DIR=wink-micro-app/fixtures/unisim_smoke
          cmake --build build/tests/host/stress
          ctest --test-dir build/tests/host/stress -R "test_pal_lockfree_pipeline|test_sim_scheduler" --output-on-failure

  winkcli-docs-drift:
    # Runs the released winkcli binary, so it must be a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest winkcli release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view --repo wink-cloud-hub/wink-ai-embedded --json tagName,publishedAt,assets > release.json 2>/dev/null; then
            echo "::warning::No winkcli release published yet; skipping drift check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          data = json.load(open("release.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("published_at=" + data["publishedAt"] + "\n")
              out.write("tag=" + data["tagName"] + "\n")
          PY

      - name: Download released winkcli
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-cli
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo wink-cloud-hub/wink-ai-embedded \
            --pattern "winkcli-*.zip" --dir dist-cli --clobber
          python - <<'PY'
          import glob, zipfile
          for archive in glob.glob("dist-cli/winkcli-*.zip"):
              zipfile.ZipFile(archive).extractall("dist-cli")
          PY

      - name: Compare live help tree with pinned snapshot
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          TAG: ${{ steps.release.outputs.tag }}
          WINK_AI_EMBEDDED_DIR: ${{ github.workspace }}
        run: |
          ./dist-cli/winkcli.exe help-tree > live-help-tree.json
          python - <<'PY'
          import datetime, json, os, subprocess, sys

          live = json.load(open("live-help-tree.json", encoding="utf-8"))
          pinned = json.load(open("wink-tools/docs/cli-help-tree.json", encoding="utf-8"))
          live.pop("generated_at", None)
          pinned.pop("generated_at", None)

          if live == pinned:
              print("help tree in sync")
              sys.exit(0)

          live_cmds = {c["name"] for c in live["commands"]}
          pinned_cmds = {c["name"] for c in pinned["commands"]}
          detail = "\n".join([
              f"- live winkcli: v{live.get('winkcli_version')} ({len(live_cmds)} commands)",
              f"- pinned snapshot: v{pinned.get('winkcli_version')} ({len(pinned_cmds)} commands)",
              f"- added: {sorted(live_cmds - pinned_cmds)}",
              f"- removed: {sorted(pinned_cmds - live_cmds)}",
          ])

          published = datetime.datetime.fromisoformat(os.environ["PUBLISHED_AT"].replace("Z", "+00:00"))
          age_h = (datetime.datetime.now(datetime.timezone.utc) - published).total_seconds() / 3600
          repo = "wink-cloud-hub/wink-ai-embedded"

          if age_h < 48:
              print(f"::warning::Release {os.environ['TAG']} is ahead of docs within the 48h grace window ({age_h:.1f}h).")
              print(detail)
              sys.exit(0)

          title = f"docs drift: winkcli {os.environ['TAG']} ahead of pinned snapshot"
          body = f"Automated docs drift detected by nightly (beyond the 48h grace window).\n\n{detail}\n\nFix: run the release docs sync (release.py dual-track) and merge the snapshot update."
          existing = subprocess.run(
              ["gh", "issue", "list", "--repo", repo, "--label", "docs-drift",
               "--state", "open", "--json", "number", "--jq", ".[0].number"],
              capture_output=True, text=True,
          ).stdout.strip()
          if existing:
              subprocess.run(["gh", "issue", "comment", existing, "--repo", repo, "--body", body], check=True)
              print(f"::error::Docs drift persists beyond 48h; commented on issue #{existing}.")
          else:
              created = subprocess.run(
                  ["gh", "issue", "create", "--repo", repo, "--label", "docs-drift",
                   "--title", title, "--body", body],
                  capture_output=True, text=True,
              )
              if created.returncode != 0:
                  # Label may not exist yet; retry without it.
                  subprocess.run(
                      ["gh", "issue", "create", "--repo", repo, "--title", title, "--body", body],
                      check=True,
                  )
              print("::error::Docs drift detected; opened a new issue.")
          sys.exit(1)
          PY

  # Gate 3 executes the linter from a PRIVATE, commercial-secret toolchain. A
  # scheduled public runner has no access to it, and granting one would mean
  # hosting that secret on third-party infrastructure. Gate enforcement is
  # therefore LOCAL: `python scripts/gate_check.py` before committing. This job
  # is retained as a manual escape hatch (workflow_dispatch) for when a
  # full-corpus re-run is wanted and a token has been provisioned deliberately.
  esp-idf-gate-nightly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Gate 3 runs with strict_environment: true, so a missing pinned toolchain
      # is a hard error rather than a skip. The job must therefore provide wink-tools
      # or it fails on every run by construction.
      WINK_TOOLS_ROOT: ${{ github.workspace }}/.wink-tools-source/packages/wink-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install pyyaml pytest
      - name: Require pinned wink-tools source
        shell: bash
        env:
          TOOLS_REPOSITORY: ${{ vars.WINK_TOOLS_REPOSITORY }}
          TOOLS_REF: ${{ vars.WINK_TOOLS_REF }}
          TOOLS_TOKEN: ${{ secrets.WINK_TOOLS_READ_TOKEN }}
        run: |
          if [[ -z "$TOOLS_REPOSITORY" || -z "$TOOLS_TOKEN" || ! "$TOOLS_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Configure WINK_TOOLS_REPOSITORY, a 40-character WINK_TOOLS_REF commit, and WINK_TOOLS_READ_TOKEN. This manual gate run needs pinned wink-tools source."
            exit 1
          fi
      - name: Checkout pinned wink-tools
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WINK_TOOLS_REPOSITORY }}
          ref: ${{ vars.WINK_TOOLS_REF }}
          token: ${{ secrets.WINK_TOOLS_READ_TOKEN }}
          path: .wink-tools-source
          persist-credentials: false
      - name: Verify toolchain source
        shell: bash
        run: test -f "$WINK_TOOLS_ROOT/wink.py"
      - name: Test the gate engine itself
        run: python -m pytest -c wink-micro-app/vendor/esp_idfv61/.governance/pyproject.toml wink-micro-app/vendor/esp_idfv61/.governance/tests -q
      - name: Run ESP-IDF Gate System (Nightly full mode)
        shell: bash
        # NOTE: Gate 2 and Gate 4 are git_diff-triggered, so on a scheduled run with
        # no diff they are skipped; the floor is therefore Gate 1 (10) + Gate 3 (1).
        run: |
          mkdir -p reports
          python wink-micro-app/vendor/esp_idfv61/.governance/gates/run_gates.py \
            --mode nightly \
            --allow-empty-diff \
            --require-executed 11 \
            --output-json reports/gate_report_nightly.json
        continue-on-error: false
      - name: Upload Nightly Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp_idf_gate_report_nightly
          path: reports/gate_report_nightly.json
