name: Release Verification Gates

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  release-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: pip install "PyYAML>=6"

      - name: Verify ABI hash, stub symbols and ISR guards
        shell: bash
        run: |
          if command -v winkcli >/dev/null 2>&1; then
            winkcli lint --pack wasm_parity --pack isr_safety --strict
          elif [ -f wink-micro-os/scripts/check_wasm_abi_hash.py ]; then
            python3 wink-micro-os/scripts/check_wasm_abi_hash.py
            python3 wink-micro-os/scripts/check_wasm_stub_symbols.py
            python3 wink-micro-os/scripts/check_isr_no_log.py
            python3 wink-micro-os/scripts/check_isr_iram_flag.py
          else
            echo "::warning::ABI/ISR verification lives in the wink-tools lint packs and winkcli is not distributed yet; skipping release verification gates (roadmap: cross-platform winkcli distribution)."
          fi
