name: License Gate

on:
  push:
  pull_request:

jobs:
  license-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify layered license map
        run: python .github/scripts/check_license_map.py
