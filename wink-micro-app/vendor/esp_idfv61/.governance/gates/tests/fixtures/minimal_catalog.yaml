spec_version: "2.0.0"
capabilities:
  cap.core.fiber_task:
    name: "Fiber Task"
    layer: core_sim
    status: implemented
    owned_paths:
      - "wink-micro-os/targets/wasm/wink_sim_scheduler.c"
      - "wink-micro-os/pal/include/pal_task.h"
    cross_mcu_evidence: ["targets/stm32/sim.c"]

  cap.core.sync_tokens:
    name: "Sync Tokens"
    layer: core_sim
    status: implemented
    owned_paths:
      - "wink-micro-os/osal/include/osal_sync.h"
    cross_mcu_evidence: ["osal/sync.c"]

  cap.irq.edge_trigger:
    name: "Edge Trigger IRQ"
    layer: pal
    status: implemented
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_gpio.h"
    cross_mcu_evidence: ["pal/gpio.c"]

  cap.pulse.tx_buffer:
    name: "Pulse Tx Buffer"
    layer: pal
    status: implemented
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pulse.h"
    cross_mcu_evidence: ["pal/pulse.c"]
    depends_on:
      mandatory:
        - "cap.core.sync_tokens"

  cap.proto.ws2812:
    name: "WS2812 Protocol"
    layer: model
    status: implemented
    owned_paths:
      - "wink-micro-os/dal/src/output/dal_ws2812.c"
    cross_mcu_evidence: ["dal/ws2812.c"]
    depends_on:
      mandatory:
        - "cap.pulse.tx_buffer"
        - "cap.core.fiber_task"
