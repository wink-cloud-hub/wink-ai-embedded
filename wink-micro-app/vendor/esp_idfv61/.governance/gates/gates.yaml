# SPDX-License-Identifier: Apache-2.0
spec_version: "2.0.0"
description: "WinkMicroOS ESP-IDF 示例分类管治门禁注册表 (SSOT)"

modes:
  pr:
    max_wall_seconds: 120
  nightly:
    max_wall_seconds: 3600

rules:
  # Gate 1: SSOT 数据完整性 (10条)
  - id: g1.path_unique
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_path_unique
    description: "upstream_path 唯一性校验"

  - id: g1.cap_id_exists
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_cap_id_exists
    description: "required_capabilities 声明合法性"

  - id: g1.id_format
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_id_format
    description: "条目稳定 ID 正则格式校验"

  - id: g1.version_alignment
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_version_alignment
    description: "spec_version 与 written_at_spec_version 版本对齐"

  - id: g1.execution_configs
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_execution_configs
    description: "executions 多配置实例合法性校验"

  - id: g1.orthogonal_states
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_orthogonal_states
    description: "五维正交状态组合约束校验"

  - id: g1.can_check_mark
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_can_check_mark
    description: "六要素闭环裁判与存量隔离区分流"

  - id: g1.quarantine_ttl
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_quarantine_ttl
    description: "存量隔离区 14 天 TTL 硬性逾期校验"

  - id: g1.sla_evidence
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_sla_evidence
    description: "排除项与预期拒绝 SLA 凭证校验"

  - id: g1.auditor_required
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_auditor_required
    description: "已审计条目责任人与配置覆盖校验"

  - id: g1.carrier_landing_integrity
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_carrier_landing_integrity
    description: "落盘 Carrier 应用实证资产配对与阶段完整性校验"

  - id: g1.scenario_semantic_integrity
    gate: 1
    severity: error
    modes: [pr, nightly]
    module: rules.g1_scenario_semantic_integrity
    description: "场景断言语义真实性、领域亲和性与防假绿拦截校验"

  # Gate 2: PAL 防膨胀 (3条)
  - id: g2.pal_naming
    gate: 2
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-os/pal/**"
      - "wink-micro-os/targets/**"
      - "wink-micro-os/osal/**"
    module: rules.g2_pal_naming
    description: "PAL/Targets/OSAL 抽象层负向器件与协议关键词扫描"
    config:
      forbidden_patterns:
        - "ws2812"
        - "rgb"
        - "pixel"
        - "necir"
        - "at24"
        - "touch_pad"
        - "servo"
        - "oled"
      # `i2c_addr` 曾在本表中，已移除：I2C 总线地址是跨 MCU 通用总线概念，
      # 属第二层应承载的通用抽象（PAL_RESOURCE_I2C_ADDR 即正确表达方式）；
      # 器件专属地址由 `at24` 覆盖。按铁律一「责任划给能力，不给器件名」，
      # 泛化的总线寻址不该被当作器件语义倒灌而拦截。
      #
      # dal/ 与 app/ 刻意不在扫描范围：按六层决策树，器件专属语义（如 WS2812 编码器）
      # 合法归属第四层 dal_ws2812，扩大扫描会误伤架构正确的代码。
      #
      # 以下 allowlist 为逐条人工审核结论，均为「PAL 正确地把能力建模为通用抽象」
      # 或「文档示例」而非器件语义倒灌。每条新增都必须写明 reason。
      allowlist:
        - path: "wink-micro-os/pal/include/hal/pal_rmt.h"
          token: "ws2812"
          reason: "pal_rmt 是通用脉冲收发能力，文档说明其泛化于 LED 灯带/红外/步进，属能力建模而非器件绑定"
        - path: "wink-micro-os/pal/include/pal_log.h"
          token: "servo"
          reason: "LOG_TAG/LOG_I 的文档示例文本，非 API 标识符"

  - id: g2.cap_has_owned_paths
    gate: 2
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-app/vendor/esp_idfv61/.governance/catalog/capability-catalog.yaml"
      - "wink-micro-app/vendor/esp_idfv61/.governance/capability-catalog.yaml"
    module: rules.g2_cap_has_owned_paths
    description: "能力项必须声明非空 owned_paths 列表"

  - id: g2.cap_cross_mcu
    gate: 2
    severity: warning
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-app/vendor/esp_idfv61/.governance/catalog/capability-catalog.yaml"
      - "wink-micro-app/vendor/esp_idfv61/.governance/capability-catalog.yaml"
    module: rules.g2_cap_cross_mcu
    description: "已实现能力跨 MCU 凭据审查"

  # Gate 3: 分层严密性 (1条)
  - id: g3.winkcli_lint
    gate: 3
    severity: error
    modes: [pr, nightly]
    module: rules.g3_winkcli_lint
    description: "委托 winkcli 执行全量分层校验"
    config:
      packs: [layering, api]
      strict_environment: true
      timeout_seconds: 120
      # 项目本地覆盖层（wink lint 原生 overlay 机制）。
      # 带 overrides/disable_rules 键的 YAML 会被当作 overlay 而非 pack，
      # add_allow_paths 追加到内置规则上——因此无需分叉私仓里的规则包。
      # 引擎与内置规则数据在私有仓，路径豁免则只对本仓布局有意义，故需要这层外置。
      overlays:
        - "wink-tools/tools/lint/rules/workspace.overlay.yaml"

  # Gate 4: 依赖反向影响闭包与回归调度 (1条)
  - id: g4.impact_regression
    gate: 4
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    module: rules.g4_impact_regression
    description: "反向传递闭包遍历与现场 Headless 仿真回归调度"
    config:
      max_inline_entries: 30

  # Gate 5: 架构防腐与断言质量 (4条)
  - id: g5.no_inline_mock
    gate: 5
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-os/frameworks/esp_idf/src/network/**"
    module: rules.g5_no_inline_mock
    description: "禁止在网络门面 C 源码中内联硬编码业务 URL 或测试 JSON"

  - id: g5.no_wifi_inline_mock
    gate: 5
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-os/frameworks/esp_idf/src/wifi/**"
    module: rules.g5_no_wifi_inline_mock
    description: "禁止在 Wi-Fi 驱动 C 源码中内联硬编码 IPv4 字符串、固定 MAC 或密码特判"

  - id: g5.network_assertion_quality
    gate: 5
    severity: error
    modes: [pr, nightly]
    module: rules.g5_network_assertion_quality
    description: "网络场景断言质量与非空载荷验证"

  - id: g5.wifi_assertion_quality
    gate: 5
    severity: error
    modes: [pr, nightly]
    module: rules.g5_wifi_assertion_quality
    description: "Wi-Fi 场景断言质量与状态/IP 语义断言验证"

  - id: g5.no_app_specific_branch
    gate: 5
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-os/frameworks/esp_idf/src/**"
    module: rules.g5_no_app_specific_branch
    description: "禁止应用特化分支（禁止 strcmp(app, ...) 等应用特化逻辑）"

  - id: g5.no_raw_delay_tasks
    gate: 5
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-os/frameworks/esp_idf/src/**"
    module: rules.g5_no_raw_delay_tasks
    description: "禁止临时延时纤程（协议栈与外设中严禁使用 xTaskCreate 创建临时延时任务）"

  - id: g5.reset_registration_verified
    gate: 5
    severity: error
    modes: [pr, nightly]
    trigger: git_diff
    trigger_paths:
      - "wink-micro-os/frameworks/esp_idf/src/**"
    module: rules.g5_reset_registration_verified
    description: "静态状态复位链注册校验（新增 static 状态必须在 esp_idf_bridge.c 复位链中注册）"



