  cap.ble.gatt_server:
    name: "BLE GATT 属性服务器"
    layer: model
    status: implemented
    description: "NimBLE GATT 服务端属性表注册、特征值读写回调与通知"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/bt/esp_nimble_gatts.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/wasm/wink_sim_ble.c"

  cap.ble.gatt_client:
    name: "BLE GATT 客户端"
    layer: model
    status: planned
    description: "NimBLE GATT 客户端远程服务发现、特征值读取与写入"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/bt/esp_nimble_gattc.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.ble.smp_security:
    name: "BLE SMP 安全配对"
    layer: model
    status: planned
