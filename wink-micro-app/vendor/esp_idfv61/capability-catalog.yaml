# SPDX-License-Identifier: Apache-2.0
spec_version: "2.0.0"
description: "WinkMicroOS ESP-IDF 官方示例仿真全景能力图谱字典 (SSOT - ADR-0092 扩充版)"

capabilities:
  # ── 1. 核心与并发调度 (cap.core.*) ──────────────────────────────────────────
  cap.core.fiber_task:
    name: "纤程任务调度"
    layer: core_sim
    status: implemented
    description: "纤程级任务创建、切换、挂起与协作式调度"
    owned_paths:
      - "wink-micro-os/targets/wasm/wink_sim_scheduler.c"
      - "wink-micro-os/pal/include/pal_task.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_scheduler.c"

  cap.core.sync_tokens:
    name: "代际同步令牌"
    layer: core_sim
    status: implemented
    description: "32位代际令牌化信号量、互斥锁、队列与事件组"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/freertos/freertos_tokens.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_sync.h"

  cap.core.category_heap:
    name: "分类记账堆内存"
    layer: facade
    status: implemented
    description: "ADR-0089 分类记账与堆边界防御、Heap Caps 门面适配"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/heap/esp_heap_caps.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_mem.h"

  cap.core.hot_restart:
    name: "模块级热重启"
    layer: core_sim
    status: planned
    description: "Phase 4 Wasm 模块实例级彻底销毁与幂等重建"
    owned_paths:
      - "wink-micro-os/targets/wasm/wasm_bridge.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # ── 2. 模拟量与波形 (cap.analog.*) ──────────────────────────────────────────
  cap.analog.adc_oneshot:
    name: "ADC 单次采样"
    layer: pal
    status: implemented
    description: "PAL 通用单次采样与引脚电平/毫伏转换"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_adc.h"
      - "wink-micro-os/targets/wasm/pal_wasm_adc.c"
      - "wink-micro-os/targets/esp32/pal_esp32_adc.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/baremetal/stm32/pal_stm32_adc.c"

  cap.analog.adc_dma:
    name: "ADC 连续 DMA 采样"
    layer: pal
    status: planned
    description: "连续双缓冲 DMA 模拟量采集接口"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_adc_dma.h"
      - "wink-micro-os/targets/wasm/pal_wasm_adc_dma.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.analog.dac_out:
    name: "DAC 模拟电压输出"
    layer: pal
    status: implemented
    description: "PAL 通用 DAC 模拟量电压输出"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_dac.h"
    soc_support: [esp32, esp32s2]
    cross_mcu_evidence:
      - "wink-micro-os/targets/baremetal/stm32/pal_stm32_dac.c"

  # ── 3. 脉冲、定时与调制 (cap.pulse.*) ───────────────────────────────────────
  cap.pulse.tx_buffer:
    name: "微秒脉冲发送缓冲"
    layer: pal
    status: implemented
    description: "PAL 通用微秒脉冲序列发送缓冲 (RMT Tx 引擎抽象)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pulse.h"
      - "wink-micro-os/targets/wasm/pal_wasm_pulse.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/baremetal/stm32/pal_stm32_pulse.c"
    depends_on:
      mandatory:
        - "cap.core.sync_tokens"

  cap.pulse.rx_capture:
    name: "微秒脉冲捕获"
    layer: pal
    status: planned
    description: "PAL 通用微秒脉冲电平跳变捕获与脉宽测量 (RMT Rx 引擎抽象)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pulse.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.pulse.pcnt_quad:
    name: "正交编码脉冲计数"
    layer: pal
    status: planned
    description: "PAL 通用正交编码脉冲计数 (PCNT)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pcnt.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.pulse.ledc_fade:
    name: "LEDC 定点 PWM 渐变"
    layer: pal
    status: implemented
    description: "LEDC 通用定时器通道、无浮点定点占空比与平滑渐变 (ADR-0066)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pwm.h"
      - "wink-micro-os/targets/wasm/pal_wasm_pwm.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_pwm.c"

  cap.pulse.mcpwm_motor:
    name: "MCPWM 多通道电机控制"
    layer: model
    status: planned
    description: "六通道死区互补 PWM、故障刹车与捕获模块"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/mcpwm/mcpwm_sim.c"
    soc_support: [esp32, esp32s3]

  cap.pulse.touch_pad:
    name: "电容触摸按键采样"
    layer: pal
    status: planned
    description: "电容触摸引脚充放电计数与阈值中断"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_touch.h"
    soc_support: [esp32, esp32s2, esp32s3]

  # ── 4. 通用串行与总线 (cap.bus.*) ───────────────────────────────────────────
  cap.bus.i2c_master:
    name: "I2C 主机模式"
    layer: pal
    status: implemented
    description: "PAL 通用 I2C 主机标准/快速模式收发事务"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_i2c.h"
      - "wink-micro-os/targets/wasm/pal_wasm_i2c.c"
      - "wink-micro-os/targets/esp32/pal_esp32_i2c.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_i2c.c"

  cap.bus.spi_master:
    name: "SPI 主机模式"
    layer: pal
    status: implemented
    description: "PAL 通用 SPI 主机轮询/DMA 传输"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_spi.h"
      - "wink-micro-os/targets/wasm/pal_wasm_spi.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_spi.c"

  cap.bus.uart_stream:
    name: "UART 异步双工字符流"
    layer: pal
    status: implemented
    description: "PAL 通用异步双工串口字符流传输与环形缓冲"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_uart.h"
      - "wink-micro-os/targets/wasm/pal_wasm_uart.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_uart.c"

  cap.bus.temp_sensor:
    name: "片上内置温度传感器"
    layer: pal
    status: implemented
    description: "片上内置温度传感器采样与温度读取"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_temp.h"
    soc_support: [esp32s2, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/wasm/pal_wasm_temp.c"

  cap.bus.parlio:
    name: "ParlIO 并行总线接口"
    layer: model
    status: planned
    description: "高速并行数据输入输出总线传输"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/parlio/parlio_sim.c"
    soc_support: [esp32c6, esp32h2, esp32p4]

  # ── 5. 专用总线与协议流 (cap.proto.*) ───────────────────────────────────────
  cap.proto.ws2812:
    name: "WS2812 协议编码管道"
    layer: model
    status: implemented
    description: "领域模型 WS2812 RGB 颜色顺序编解码与灯带管道"
    owned_paths:
      - "wink-micro-os/dal/src/output/dal_ws2812.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/dal/include/output/dal_ws2812.h"
    depends_on:
      mandatory:
        - "cap.pulse.tx_buffer"
        - "cap.core.fiber_task"

  cap.proto.nec_ir:
    name: "NEC 红外遥控协议模型"
    layer: model
    status: planned
    description: "领域模型 NEC 38kHz 载波收发解析状态机"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/rmt/esp_nec_ir_model.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.proto.twai_can:
    name: "TWAI / CAN 总线帧模型"
    layer: model
    status: planned
    description: "领域模型 CAN 帧过滤与虚拟总线广播"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/twai/esp_twai_model.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.proto.i2s_stream:
    name: "I2S 音频流管道"
    layer: model
    status: planned
    description: "领域模型 I2S 音频流环形缓冲管道与时钟生成"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/i2s/esp_i2s_model.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # ── 6. 存储与文件系统 (cap.vfs.*, cap.storage.*) ────────────────────────────
  cap.vfs.mem_sandbox:
    name: "内存沙箱文件系统"
    layer: model
    status: implemented
    description: "纯内存 Inode 树状沙箱文件系统 (POSIX VFS 适配)"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/vfs/vfs_mem_sandbox.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_fs.h"

  cap.vfs.nvs_partition:
    name: "虚拟 NVS 分区与键值存储"
    layer: model
    status: implemented
    description: "虚拟 Flash 分区表与 NVS 键值对存储模型"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/nvs/nvs_sim_partition.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_nvs.h"

  cap.vfs.spiffs_format:
    name: "SPIFFS 镜像与挂载"
    layer: model
    status: planned
    description: "SPIFFS 扁平文件系统镜像加载与挂载"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/spiffs/spiffs_sim.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.vfs.fatfs_vfs:
    name: "FATFS 文件系统挂载"
    layer: model
    status: planned
    description: "虚拟 FATFS 文件系统挂载与 POSIX VFS 接口适配"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/vfs/vfs_fatfs.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.storage.wear_levelling:
    name: "Flash 磨损均衡层"
    layer: model
    status: planned
    description: "Wear Levelling 磨损均衡虚拟扇区抽象"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/storage/wear_levelling.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.storage.sdmmc_host:
    name: "SD/SDMMC 主机传输"
    layer: model
    status: planned
    description: "SDMMC/SDIO 主机总线协议与块设备挂载"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/storage/sdmmc_sim.c"
    soc_support: [esp32, esp32s3]

  cap.storage.partition_api:
    name: "Flash 分区表多区寻址"
    layer: model
    status: implemented
    description: "esp_partition_find / read / write 多分区表寻址与只读映射"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/storage/partition_sim.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_flash.h"

  # ── 7. 网络与真实连接 (cap.net.*, cap.wifi.*, cap.mesh.*) ───────────────────
  cap.net.event_pump:
    name: "异步事件泵与信封分发"
    layer: facade
    status: implemented
    description: "D2 异步深拷贝事件队列与分发 (esp_event 核心循环)"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/event/esp_event_pump.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_event.h"

  cap.net.host_socket:
    name: "宿主原生 Socket 隧道"
    layer: host_bridge
    status: implemented
    description: "宿主 POSIX / WinSock 原生网络隧道代理 (TCP/UDP 收发)"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/net/host_socket_tunnel.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/wasm/wink_sim_net.c"

  cap.net.host_ws_tunnel:
