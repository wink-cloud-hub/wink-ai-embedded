# SPDX-License-Identifier: Apache-2.0
spec_version: "1.1.0"
description: "WinkMicroOS ESP-IDF 官方示例仿真能力图谱字典 (SSOT)"

capabilities:
  # 1. 核心与并发调度 (cap.core.*)
  cap.core.fiber_task:
    name: "纤程任务调度"
    layer: core_sim
    status: implemented
    description: "纤程级任务创建、切换、挂起与协作式调度"
    owned_paths:
      - "wink-micro-os/targets/wasm/wink_sim_scheduler.c"
      - "wink-micro-os/pal/include/pal_task.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_scheduler.c"

  cap.core.sync_tokens:
    name: "代际同步令牌"
    layer: core_sim
    status: implemented
    description: "32位代际令牌化信号量、互斥锁、队列与事件组"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/freertos/freertos_tokens.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/osal/include/osal_sync.h"

  cap.core.category_heap:
    name: "分类记账堆内存"
    layer: facade
    status: implemented
    description: "ADR-0089 分类记账与堆边界防御、Heap Caps 门面适配"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/heap/esp_heap_caps.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.core.hot_restart:
    name: "模块级热重启"
    layer: core_sim
    status: planned
    description: "Phase 4 Wasm 模块实例级彻底销毁与幂等重建"
    owned_paths:
      - "wink-micro-os/targets/wasm/wasm_bridge.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 2. 模拟量与波形 (cap.analog.*)
  cap.analog.adc_oneshot:
    name: "ADC 单次采样"
    layer: pal
    status: implemented
    description: "PAL 通用单次采样与引脚电平/毫伏转换"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_adc.h"
      - "wink-micro-os/targets/wasm/pal_wasm_adc.c"
      - "wink-micro-os/targets/esp32/pal_esp32_adc.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/baremetal/stm32/pal_stm32_adc.c"

  cap.analog.adc_dma:
    name: "ADC 连续 DMA 采样"
    layer: pal
    status: planned
    description: "连续双缓冲 DMA 模拟量采集接口"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_adc_dma.h"
      - "wink-micro-os/targets/wasm/pal_wasm_adc_dma.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.analog.dac_out:
    name: "DAC 模拟电压输出"
    layer: pal
    status: implemented
    description: "PAL 通用 DAC 模拟量电压输出"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_dac.h"
    soc_support: [esp32, esp32s2]
    cross_mcu_evidence:
      - "wink-micro-os/targets/baremetal/stm32/pal_stm32_dac.c"

  # 3. 脉冲与高精度时序 (cap.pulse.*)
  cap.pulse.tx_buffer:
    name: "微秒脉冲发送缓冲"
    layer: pal
    status: implemented
    description: "PAL 通用微秒脉冲序列发送缓冲 (RMT Tx 引擎抽象)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pulse.h"
      - "wink-micro-os/targets/wasm/pal_wasm_pulse.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    depends_on:
      mandatory:
        - "cap.core.sync_tokens"

  cap.pulse.rx_capture:
    name: "微秒脉冲捕获"
    layer: pal
    status: planned
    description: "PAL 通用微秒脉冲电平跳变捕获与脉宽测量 (RMT Rx 引擎抽象)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pulse.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.pulse.pcnt_quad:
    name: "正交编码脉冲计数"
    layer: pal
    status: planned
    description: "PAL 通用正交编码脉冲计数 (PCNT)"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_pcnt.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 4. 通用串行与总线 (cap.bus.*)
  cap.bus.i2c_master:
    name: "I2C 主机模式"
    layer: pal
    status: implemented
    description: "PAL 通用 I2C 主机标准/快速模式收发事务"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_i2c.h"
      - "wink-micro-os/targets/wasm/pal_wasm_i2c.c"
      - "wink-micro-os/targets/esp32/pal_esp32_i2c.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_i2c.c"

  cap.bus.spi_master:
    name: "SPI 主机模式"
    layer: pal
    status: implemented
    description: "PAL 通用 SPI 主机轮询/DMA 传输"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_spi.h"
      - "wink-micro-os/targets/wasm/pal_wasm_spi.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.bus.uart_stream:
    name: "UART 异步双工字符流"
    layer: pal
    status: implemented
    description: "PAL 通用异步双工串口字符流传输与环形缓冲"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_uart.h"
      - "wink-micro-os/targets/wasm/pal_wasm_uart.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/frameworks/mcs51/targets/wasm/sim_uart.c"

  # 5. 虚拟协议与语义流 (cap.proto.*)
  cap.proto.ws2812:
    name: "WS2812 协议编码管道"
    layer: model
    status: implemented
    description: "领域模型 WS2812 RGB 颜色顺序编解码与灯带管道"
    owned_paths:
      - "wink-micro-os/dal/src/output/dal_ws2812.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    depends_on:
      mandatory:
        - "cap.pulse.tx_buffer"
        - "cap.core.fiber_task"

  cap.proto.nec_ir:
    name: "NEC 红外遥控协议模型"
    layer: model
    status: planned
    description: "领域模型 NEC 38kHz 载波收发解析状态机"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/rmt/esp_nec_ir_model.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.proto.twai_can:
    name: "TWAI / CAN 总线帧模型"
    layer: model
    status: planned
    description: "领域模型 CAN 帧过滤与虚拟总线广播"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/twai/esp_twai_model.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.proto.i2s_stream:
    name: "I2S 音频流管道"
    layer: model
    status: planned
    description: "领域模型 I2S 音频流环形缓冲管道与时钟生成"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/i2s/esp_i2s_model.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 6. 存储与虚拟文件系统 (cap.vfs.*)
  cap.vfs.mem_sandbox:
    name: "内存沙箱文件系统"
    layer: model
    status: implemented
    description: "纯内存 Inode 树状沙箱文件系统 (POSIX VFS 适配)"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/vfs/vfs_mem_sandbox.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.vfs.nvs_partition:
    name: "虚拟 NVS 分区与键值存储"
    layer: model
    status: implemented
    description: "虚拟 Flash 分区表与 NVS 键值对存储模型"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/nvs/nvs_sim_partition.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.vfs.spiffs_format:
    name: "SPIFFS 镜像与挂载"
    layer: model
    status: planned
    description: "SPIFFS 扁平文件系统镜像加载与挂载"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/spiffs/spiffs_sim.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 7. 网络与真实连接 (cap.net.*)
  cap.net.event_pump:
    name: "异步事件泵与信封分发"
    layer: facade
    status: implemented
    description: "D2 异步深拷贝事件队列与分发"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/event/esp_event_pump.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.net.host_socket:
    name: "宿主原生 Socket 隧道"
    layer: host_bridge
    status: implemented
    description: "宿主 POSIX / WinSock 原生网络隧道代理"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/net/host_socket_tunnel.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.net.host_ws_tunnel:
    name: "浏览器 WebSocket 网络代理"
    layer: host_bridge
    status: implemented
    description: "浏览器 WebSocket 真实全双工网络代理与信令转换"
    owned_paths:
      - "wink-micro-os/targets/wasm/wasm_net_bridge.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 8. 协处理器与特殊硬件 (cap.coproc.*)
  cap.coproc.ulp_fsm:
    name: "ULP FSM 虚拟机与 RTC 共享内存"
    layer: model
    status: planned
    description: "ULP 状态机汇编解释器与 RTC 慢速内存共享"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/ulp/ulp_fsm_vm.c"
    soc_support: [esp32, esp32s3]

  cap.coproc.ulp_riscv:
    name: "ULP RISC-V 加载器"
    layer: model
    status: planned
    description: "ULP RISC-V 32位 ELF 二进制加载器与沙箱"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/ulp/ulp_riscv_vm.c"
    soc_support: [esp32s2, esp32s3]

  # 9. DMA 与传输模型 (cap.dma.*)
  cap.dma.memcpy_sim:
    name: "DMA 描述符与内存传输"
    layer: core_sim
    status: implemented
    description: "DMA 传输仿真与链表描述符更新"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/dma/sim_dma.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.dma.double_buffer:
    name: "DMA 双缓冲与完成中断"
    layer: core_sim
    status: planned
    description: "乒乓双缓冲与传输完成回调分发"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/dma/sim_dma_double_buf.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 10. 中断与回调上下文 (cap.irq.*)
  cap.irq.isr_dispatch:
    name: "ISR 上下文模拟"
    layer: core_sim
    status: implemented
    description: "ISR 上下文纤程模拟、从 ISR 发送队列与栈隔离"
    owned_paths:
      - "wink-micro-os/targets/wasm/wink_sim_irq.c"
      - "wink-micro-os/pal/include/pal_interrupt.h"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.irq.edge_trigger:
    name: "GPIO 边沿中断触发"
    layer: pal
    status: implemented
    description: "GPIO 边沿中断触发、去抖与分发"
    owned_paths:
      - "wink-micro-os/pal/include/hal/pal_gpio.h"
      - "wink-micro-os/targets/wasm/pal_wasm_gpio.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # 11. 构建与配置 (cap.build.*)
  cap.build.component_reg:
    name: "CMake 原厂组件解析"
    layer: build
    status: implemented
    description: "idf_component_register 透明解析与依赖链接"
    owned_paths:
      - "wink-tools/packages/wink-tools/wink/build_system/cmake_parser.py"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.build.kconfig_parse:
    name: "Kconfig 宏自动映射"
    layer: build
    status: implemented
    description: "sdkconfig.defaults 自动映射与编译宏转义"
    owned_paths:
      - "wink-tools/packages/wink-tools/wink/build_system/kconfig_bridge.py"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
