    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/wasm/wink_sim_crypto.c"

  cap.crypto.hw_sha_aes:
    name: "硬件 SHA/AES 加速器校验"
    layer: facade
    status: planned
    description: "硬件加密引擎只读校验与数据块计算门面"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/crypto/hw_crypto_facade.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  # ── 11. 系统控制台与生命周期 (cap.system.*, cap.usb.*) ─────────────────────
  cap.system.console_cmd:
    name: "虚拟控制台交互"
    layer: facade
    status: implemented
    description: "esp_console / linenoise 命令行输入解析与命令分发"
    owned_paths:
