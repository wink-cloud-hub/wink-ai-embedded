    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/wasm/wink_sim_wifi.c"

  cap.wifi.ap_mode:
    name: "Wi-Fi SoftAP 模式"
    layer: facade
    status: planned
    description: "SoftAP 热点广播、客户端连接事件与虚拟 DHCP Server"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/wifi/esp_wifi_ap_sim.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.mesh.esp_now:
    name: "ESP-NOW 无连接通信"
    layer: model
    status: planned
    description: "ESP-NOW 局域无连接 MAC 帧收发与广播管道"
    owned_paths:
