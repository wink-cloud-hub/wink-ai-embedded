  # ── 9. 电源管理与休眠 (cap.pm.*) ────────────────────────────────────────────
  cap.pm.light_sleep:
    name: "Light-sleep 轻度休眠"
    layer: core_sim
    status: planned
    description: "CPU 纤程暂停调度、时钟门控与定时器微秒唤醒"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/pm/esp_pm_sleep.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

  cap.pm.deep_sleep:
    name: "Deep-sleep 深度休眠"
    layer: core_sim
    status: planned
    description: "上下文断电、RTC 内存保留与 RTC GPIO/定时器唤醒重置"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/pm/esp_pm_deep_sleep.c"
