    soc_support: [esp32, esp32s3, esp32c3, esp32c6]
    cross_mcu_evidence:
      - "wink-micro-os/targets/wasm/wink_sim_net.c"

  cap.wifi.station_mode:
    name: "Wi-Fi Station 模式与事件循环"
