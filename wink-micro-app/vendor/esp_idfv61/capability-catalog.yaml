    layer: model
    status: planned
    description: "OTA 双应用分区镜像写入、启动标记切换与回滚"
    owned_paths:
      - "wink-micro-os/frameworks/esp_idf/src/system/esp_ota_sim.c"
    soc_support: [esp32, esp32s3, esp32c3, esp32c6]

