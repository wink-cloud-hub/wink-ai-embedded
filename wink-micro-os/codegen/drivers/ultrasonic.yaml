codegen_schema: "1.1"
type: ultrasonic
category: sensor
is_actuator: false
experimental: false
default_role: distance_sensor

# Spec §9.3 / ADR-0056: ultrasonic distance is a B-class (sensor measurement)
# physical quantity. The C DAL exposes float distance_cm on Full Profile;
# Micro Profile binding collapses it to a scaled integer (per dal-micro-profile-spec).
quantity: distance
quantity_class: sensor_measurement

fields:
  trig_pin:
    tier: advanced
    type: int
    required: true
    min: 0
    max: 39
  echo_pin:
    tier: advanced
    type: int
    required: true
    min: 0
    max: 39
  use_rmt:
    tier: advanced
    type: bool
    default: true
    emit: macro
    config_member: true
  auto_poll_ms:
    tier: stable
    type: int
    default: 50
    min: 50
    emit: macro
    c_suffix: u
  role:
    tier: stable
    type: string
    emit: none

# Spec §16.2 / ADR-0046: explicit init/deinit/safe_off binding for the OS
# driver registry SSOT. Empty safe_off_fn marks "no safe-off semantic"
# (required for is_actuator: false devices per DAL-L-020).
config:
  c_type: dal_ultrasonic_t
  config_type: dal_ultrasonic_config_t
  headers: [dal_ultrasonic.h]
  init_fn: dal_ultrasonic_init
  deinit_fn: dal_ultrasonic_deinit
  safe_off_fn: ""

# Spec §5.4 / DAL-V-002: device-specific API hooks (apply_override) MUST
# be tagged so they do not enter the generic role-verb plane. The
# apply_override entry point is invoked by the device_tree override
# machinery (wink_dev_config.h) only — codegen does not generate role
# bindings for it. Marked here for forthcoming per-API-tagged codegen.
device_specific_apis:
  - apply_override

role_bindings:
  distance_sensor:
    headers: [sensor/wink_ultrasonic_distance_events.h]
    verbs:
      request_measurement:
        template: "WINK_WARN_UNUSED_RESULT static inline wink_status_t {{ name }}_request_measurement(void) { return dal_ultrasonic_request_measurement(&{{ name }}); }"
      read_distance:
        template: "static inline float {{ name }}_read_distance(void) { float d = -1.0f; WINK_IGNORE_RESULT(dal_ultrasonic_get_cached_distance(&{{ name }}, &d)); return d; }"
      read_distance_status:
        template: "WINK_WARN_UNUSED_RESULT static inline wink_status_t {{ name }}_read_distance_status(float *out_dist_cm) { return dal_ultrasonic_get_cached_distance(&{{ name }}, out_dist_cm); }"
      enable_distance_events:
        template: "WINK_WARN_UNUSED_RESULT static inline wink_status_t {{ name }}_enable_distance_events(void) { static const wink_ultrasonic_distance_event_config_t cfg = { .period_ms = {{ auto_poll_ms }}u }; return wink_ultrasonic_enable_distance_events(&{{ name }}, &cfg); }"
      disable_distance_events:
        template: "static inline void {{ name }}_disable_distance_events(void) { wink_ultrasonic_disable_distance_events(&{{ name }}); }"
