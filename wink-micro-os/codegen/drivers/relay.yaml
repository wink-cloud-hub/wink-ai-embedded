codegen_schema: "1.1"
type: relay
category: output
is_actuator: true
experimental: false
default_role: binary_indicator

# Physical quantity dimension marker (ADR-0056 / DAL-U-021)
quantity: binary
quantity_class: actuator_command

fields:
  owner:
    tier: stable
    type: string
    emit: none
  gpio_pin:
    tier: advanced
    type: int
    required: true
    c: pin
  reset_pin:
    tier: advanced
    type: int
    default: -1
  pulse_duration_ms:
    tier: advanced
    type: int
    default: 50
  variant:
    tier: advanced
    type: enum
    enum: [direct_gpio, ssr, latching_dual_pin]
    map:
      direct_gpio: DAL_RELAY_VARIANT_DIRECT_GPIO
      ssr: DAL_RELAY_VARIANT_SSR
      latching_dual_pin: DAL_RELAY_VARIANT_LATCHING_DUAL_PIN
    default: direct_gpio
  active_low:
    tier: advanced
    type: bool
    default: false
  initial_state:
    tier: advanced
    type: bool
    default: false
  role:
    tier: stable
    type: string
    emit: none

quantities:
  owner:             { quantity_class: actuator_command }
  gpio_pin:          { quantity_class: actuator_command }
  reset_pin:         { quantity_class: actuator_command }
  pulse_duration_ms: { quantity_class: actuator_command }
  variant:           { quantity_class: actuator_command }
  active_low:        { quantity_class: actuator_command }
  initial_state:     { quantity_class: actuator_command }
  role:              { quantity_class: actuator_command }

config:
  c_type: dal_relay_t
  config_type: dal_relay_config_t
  headers: [output/dal_relay.h]
  init_fn: dal_relay_init
  deinit_fn: dal_relay_deinit
  init_template_file: templates/relay_init.c.j2
  # ADR-0058: relay is an actuator; safe-off binds to turn_off (de-energize).
  safe_off_fn: dal_relay_safe_off
  # Latching variants need dal_relay_poll() every tick to clear pulses; the
  # generated thunk is a no-op for DIRECT_GPIO/SSR. post_init emits the
  # wink_runtime_register_poll() call and the file-scope POLL_THUNK is rendered
  # from config.poll_fn below.
  poll_fn: dal_relay_poll
  post_init_template_file: templates/relay_post_init.c.j2

role_bindings:
  binary_indicator:
    covers_contract: full
    headers: []
    verbs:
      activate:
        template: "static inline void {{ name }}_activate(void) { WINK_IGNORE_RESULT(dal_relay_on(&{{ name }})); }"
      deactivate:
        template: "static inline void {{ name }}_deactivate(void) { WINK_IGNORE_RESULT(dal_relay_off(&{{ name }})); }"
      toggle:
        template: "static inline void {{ name }}_toggle(void) { WINK_IGNORE_RESULT(dal_relay_toggle(&{{ name }})); }"
