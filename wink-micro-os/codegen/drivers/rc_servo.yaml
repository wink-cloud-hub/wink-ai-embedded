codegen_schema: "1.1"
type: rc_servo
category: actuator
is_actuator: true
experimental: true
default_role: angular_actuator

quantity: angle
quantity_class: actuator_command

advanced_only: [resolution_bits, clock_requirement]

fields:
  pwm_channel:
    tier: advanced
    type: int
    required: true
  resolution_bits:
    tier: advanced
    type: int
    min: 1
    max: 20
    emit_when: present
    c_suffix: u
  clock_requirement:
    tier: advanced
    type: enum
    emit_when: present
    enum: [auto, stable_required]
    map:
      auto: DAL_RC_SERVO_CLOCK_AUTO
      stable_required: DAL_RC_SERVO_CLOCK_STABLE_REQUIRED
  min_pulse_us:
    tier: stable
    type: int
    default: 500
    emit: macro
    emit_when: present
    c_suffix: u
  max_pulse_us:
    tier: stable
    type: int
    default: 2500
    emit: macro
    emit_when: present
    c_suffix: u
  max_angle_ddeg:
    tier: stable
    type: int
    default: 1800
    emit_when: present
    c_suffix: u
  role:
    tier: stable
    type: string
    emit: none

constraints:
  - field: max_angle_ddeg
    type: int
    optional: true
    min: 1

config:
  c_type: dal_rc_servo_t
  config_type: dal_rc_servo_config_t
  headers: [dal_rc_servo.h]
  deinit_fn: dal_rc_servo_deinit
  safe_off_fn: dal_rc_servo_safe_off

role_bindings:
  angular_actuator:
    headers: []
    verbs:
      set_angle:
        template: "static inline void {{ name }}_set_angle(uint16_t angle_ddeg) { WINK_IGNORE_RESULT(dal_rc_servo_set_angle(&{{ name }}, angle_ddeg)); }"
