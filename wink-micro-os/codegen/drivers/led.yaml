codegen_schema: "1.1"
type: led
category: output
is_actuator: true
experimental: false
default_role: binary_indicator

fields:
  gpio_pin:
    tier: advanced
    type: int
    required: true
    c: pin
  active_high:
    tier: advanced
    type: bool
    default: true
    emit: macro
    config_member: true
  role:
    tier: stable
    type: string
    emit: none

config:
  # Dedicated safe_off (vs dal_led_off): uninitialized→WINK_OK, no WARN_UNUSED_RESULT
  # (DAL-L-021/022); invoked by wink_actuator_safe_off_all() on fault paths.
  safe_off_fn: dal_led_safe_off

