## wink-micro-os ESP-IDF Component Configuration
## Usage: Depend on this directory via idf_component.yml in your ESP-IDF project
##
## dependencies:
##   wink-micro-os:
##     path: ../path/to/wink-micro-os

version: "0.1.0"
description: "Wink Micro OS - Lightweight runtime for AI-generated embedded applications"
url: "https://github.com/wink-ai/wink-micro-os"
maintainers:
  - "Wink AI Team"
license: "Apache-2.0"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6

dependencies:
  idf: ">=5.0"
