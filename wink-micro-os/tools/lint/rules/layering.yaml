version: 1
id: layering
metadata:
  owner: "wink-arch"
  adr: ["ADR-0043", "ADR-0038"]

layers:
  bal_public:
    roots: ["bal/include"]
    kind: public_header
  bal_src:
    roots: ["bal/src"]
    kind: source
  dal_public:
    roots: ["dal/include"]
    kind: public_header
  dal_src:
    roots: ["dal/src"]
    kind: source
  app_src:
    roots: ["apps/*/src"]
    kind: source

include_rules:
  - id: BAL-HDR-NO-PAL
    in: [bal_public]
    deny:
      - match: basename
        pattern: 'pal_.*\.h'
        except_basename: ['pal_log.h']
        include_forms: [quote]
    message: >-
      ADR-0023 §8 red-line: bal/include/**/*.h must not include pal_*.h
      (pal_log.h only). Move pal_ usage to the .c file.
    severity: error
    immutable: true
    refs: ["ADR-0023"]

api_rules: []
path_rules: []
ignore: []
