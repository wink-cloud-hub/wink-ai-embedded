    reason: "Mistranslation for PAL (Platform Abstraction Layer)"
  - pattern: "\\bDali\\b"
    reason: "Mistranslation for DAL (Device Abstraction Layer)"
  - pattern: "\\bsame source compile\\b"
    reason: "Use canonical 'single-source dual-target compilation'"
  - pattern: "\\bdead resource\\b"
    reason: "Use canonical 'zombie resource reclamation'"
  - pattern: "\\binterrupt background\\b"
    reason: "Use canonical 'ISR context'"
  - pattern: "\\bminus error code\\b"
    reason: "Use canonical 'negative status-code convention'"
  - pattern: "\\bdangerous zone\\b"
    reason: "Use canonical 'critical section'"
  - pattern: "\\balive doc\\b"
    reason: "Use canonical 'living specification'"
  - pattern: "\\btruth source\\b"
    reason: "Use canonical 'Single Source of Truth (SSOT)'"
  - pattern: "\\bstack fix\\b"
    reason: "Use canonical 'stack clamping'"
