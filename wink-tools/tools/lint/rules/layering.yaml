version: 1
id: layering
metadata:
  owner: 'wink-arch'
  adr: ['ADR-0043', 'ADR-0038', 'ADR-0023']

layers:
  bal_public:
    roots: ['bal/include']
    kind: public_header
  bal_math:
    roots: ['bal/include/math']
    kind: public_header
  bal_src:
    roots: ['bal/src']
    kind: source
  dal_public:
    roots: ['dal/include']
    kind: public_header
  dal_src:
    roots: ['dal/src']
    kind: source
  app_src:
    roots: ['apps/*/src']
    kind: source
  runtime_src:
    roots: ['runtime/src']
    kind: source
  targets_wasm:
    roots: ['targets/wasm']
    kind: source
  # File-scoped layer for Axis F (fault/degradation) translation units.
  # classify_file matches exact root paths, so listing each file here scopes
  # the WASM-DEGRADATION-FAULT-ISOLATION rule to these TUs only (the engine
  # does not read a per-rule path_regex field).
  wasm_fault:
    roots:
      - 'targets/wasm/pal_wasm_degradation.c'
      - 'targets/wasm/pal_wasm_fault.c'
      - 'targets/wasm/pal_wasm_fault_domain.c'
    kind: source

include_rules:
  - id: BAL-HDR-NO-PAL
    in: [bal_public, bal_math]
    deny:
      - match: basename
        pattern: 'pal_.*\.h'
        except_basename: ['pal_log.h']
        include_forms: [quote, angle]
    message: >-
      ADR-0023 §8 red-line: bal/include/**/*.h must not include pal_*.h
      (pal_log.h only). Move pal_ usage to the .c file.
    severity: error
    immutable: true
    refs: ['ADR-0023']

  - id: DAL-HDR-NO-HAL
    in: [dal_public]
    deny:
      - match: basename
        pattern: 'pal_hal\.h'
        include_forms: [quote, angle]
    message: >-
      DAL public headers must not leak HAL (pal_hal.h). Keep HAL includes in .c only.
    severity: error
    immutable: false
    refs: ['ADR-0043']
    allow_paths:
      - path: 'dal/include/actuator/dal_dc_motor.h'
        reason: 'Task 10b deferred — needs wink_pin_t + pal_gpio_mode_t typedef split; backlog'
        until: '2026-12-31'
      - path: 'dal/include/sensor/dal_encoder.h'
        reason: 'Task 10b deferred — needs wink_pin_t + pal_gpio_mode_t typedef split; backlog'
        until: '2026-12-31'

  - id: BAL-SRC-HAL-ALLOWLIST
    in: [bal_src]
    deny:
      - match: basename
        pattern: 'pal_hal\.h'
        include_forms: [quote, angle]
    message: >-
      bal/src must not include pal_hal.h except allowlisted IRQ helpers.
    severity: error
    immutable: false
    refs: ['ADR-0043']
    allow_paths:
      - path: 'bal/src/input/wink_button_events_irq.c'
        reason: 'GPIO stable-state sampling requires pal_gpio_read'

path_rules:
  - id: BAL-NAME-1
    in: [bal_public, bal_math]
    deny_filename: ['*_helper.h', '*_controller.h']
    locator: filename
    message: >-
      BAL-NAME-1: forbidden helper/controller header name under bal/include
    severity: error
    immutable: true
    refs: ['ADR-0038']

  - id: BAL-MATH-1
    in: [bal_math]
    deny_content_regex:
      - 'dal_'
      - 'wink_runtime'
      - 'wink_periodic'
      - 'pal_'
      - '^\s*#\s*include\s*[<"]pal_'
    locator: first_content_hit
    message: >-
      BAL-MATH-1: math headers must stay pure (no DAL/runtime/PAL leakage)
    severity: error
    immutable: true
    refs: ['ADR-0038']

  - id: BAL-NAME-2
    in: [bal_public, bal_math]
    deny_content_regex:
      - '\bsonar\b'
    locator: first_content_hit
    message: >-
      BAL-NAME-2: public headers must not contain identifier 'sonar'
    severity: error
    immutable: true
    refs: ['ADR-0038']

api_rules:
  - id: WASM-DAL-ISOLATION
    in: [dal_src]
    deny_regex:
      - pattern: '#\s*(ifdef|ifndef)\s+(SIMULATION|WASM|__EMSCRIPTEN__)'
      - pattern: '#\s*if\s+(!?\s*)?defined\s*\(\s*(SIMULATION|WASM|__EMSCRIPTEN__)\s*\)'
    context:
      strip_comments: false
      strip_strings: true
      scope_by_kind:
        source: full
    except_regex: []
    message: >-
      ADR-0003 §3 red-line: dal/src must not contain any #ifdef SIMULATION/WASM
      conditional. All physical interception MUST happen in targets/wasm/ only.
    severity: error
    immutable: true
    refs: ['ADR-0003']

  - id: WASM-DEGRADATION-FAULT-ISOLATION
    in: [wasm_fault]
    deny_regex:
      - pattern: '#\s*include\s*["<]pal_wasm_ch\d.*\.h[">]'
    context:
      strip_comments: false
      # Must NOT strip strings: the offending channel header name lives inside
      # the #include "..." string literal.
      strip_strings: false
      scope_by_kind:
        source: full
    except_regex: []
    message: >-
      06 v2.0 Rule 5: pal_wasm_degradation.c and pal_wasm_fault*.c must not
      include any pal_wasm_ch*.h channel internal headers. Physical degradation
      and fault domains must remain decoupled from specific hardware channels.
    severity: error
    immutable: true
    refs: ['06-c-target-architecture-and-refactoring-proposal']

ignore: []
